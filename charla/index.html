<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Charla">
  <meta name="theme-color" content="#0b0a14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Speak Spanish out loud from day one with a friendly tutor">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Charla</title>
  <style>
    :root {
      --bg: #0b0a14; --surface: #16151f; --surface-2: #201f2c; --surface-3: #2a2938;
      --border: #2c2b3b; --text: #f4f3fa; --muted: #9a98ad; --dim: #6c6a80;
      --accent: #7c5cff; --accent-2: #00b8ff;
      --grad: linear-gradient(135deg, #7c5cff 0%, #00b8ff 100%);
      --good: #2fd98b; --ok: #ffc145; --bad: #ff5d6c; --fire: #ff8a3d;
      --nav-h: 66px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }
    input, textarea { user-select: text; -webkit-user-select: text; font: inherit; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .hidden { display: none !important; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
    .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom)); }

    /* Buttons */
    .btn {
      display: block; width: 100%; padding: 16px; border-radius: 999px;
      font-weight: 700; font-size: 1.05rem; text-align: center;
      background: var(--grad); color: #fff;
      transition: transform .08s, opacity .15s;
    }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { background: var(--surface-3); color: var(--dim); cursor: default; }
    .btn.white { background: #fff; color: #17151f; }
    .btn.quiet { background: var(--surface-2); color: var(--text); }
    .btn.link { background: none; color: var(--muted); font-weight: 600; font-size: .95rem; padding: 12px; }
    .btn + .btn { margin-top: 10px; }

    /* Tutor avatar */
    .avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: block; }
    .avatar.lg { width: 96px; height: 96px; }
    .avatar.xl { width: 128px; height: 128px; }

    /* Home header */
    .hello { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .hello h1 { font-size: 1.6rem; letter-spacing: -0.02em; }
    .hello p { color: var(--muted); font-size: .92rem; margin-top: 2px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: .95rem; }
    .pill.fire { color: var(--fire); }
    .pill.off { color: var(--dim); }
    .pill.off .ico { filter: grayscale(1); opacity: .5; }

    /* Daily goal ring */
    .goal { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; margin-bottom: 16px; }
    .ring { width: 54px; height: 54px; flex-shrink: 0; }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .track { stroke: var(--surface-3); }
    .ring .val { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset .5s; transform: rotate(-90deg); transform-origin: 50% 50%; }
    .goal h3 { font-size: 1rem; }
    .goal p { color: var(--muted); font-size: .87rem; margin-top: 2px; }

    /* Continue hero */
    .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px; background: var(--grad); margin-bottom: 26px; }
    .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.12); }
    .hero small { font-weight: 700; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
    .hero h2 { font-size: 1.5rem; margin: 4px 0 4px; letter-spacing: -0.01em; position: relative; z-index: 1; }
    .hero p { opacity: .92; font-size: .95rem; margin-bottom: 16px; position: relative; z-index: 1; }
    .hero .row { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
    .hero .btn { width: auto; padding: 12px 22px; flex-shrink: 0; }
    .hero .emoji { font-size: 2.6rem; position: absolute; right: 18px; top: 16px; z-index: 1; }

    /* Course list */
    .unit { margin-bottom: 26px; }
    .unit-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .unit-head small { color: var(--accent-2); font-weight: 700; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
    .unit-head h3 { font-size: 1.2rem; letter-spacing: -0.01em; }
    .unit-head span { color: var(--muted); font-size: .85rem; font-weight: 600; }
    .lesson-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; margin-bottom: 8px; transition: transform .08s; }
    .lesson-row:active:not(.locked) { transform: scale(.985); }
    .lesson-row .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 1.5rem; flex-shrink: 0; }
    .lesson-row .t { flex: 1; min-width: 0; }
    .lesson-row .t b { display: block; font-size: 1rem; }
    .lesson-row .t span { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lesson-row .st { font-size: .85rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .lesson-row.done .st { color: var(--good); }
    .lesson-row.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .lesson-row.locked { opacity: .45; cursor: default; }

    /* Bottom nav */
    .nav { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; background: rgba(11,10,20,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
    .nav button { flex: 1; max-width: 110px; padding: 4px 0; color: var(--dim); }
    .nav svg { width: 24px; height: 24px; display: block; margin: 0 auto 3px; }
    .nav span { font-size: .7rem; font-weight: 700; }
    .nav button.on { color: var(--text); }

    .section-title { font-size: 1.45rem; letter-spacing: -0.02em; margin-bottom: 4px; }
    .section-sub { color: var(--muted); font-size: .93rem; margin-bottom: 18px; line-height: 1.4; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
    .card h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .card p { color: var(--muted); font-size: .9rem; line-height: 1.4; }
    .tag { display: inline-block; font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: rgba(124,92,255,.18); color: #b9a8ff; margin-bottom: 8px; }

    /* Tutor card (Talk tab) */
    .tutor-card { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    .tutor-card .btn { margin-top: 14px; }
    .topics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
    .topic { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px; text-align: left; transition: transform .08s; }
    .topic:active { transform: scale(.97); }
    .topic .e { font-size: 1.7rem; display: block; margin-bottom: 8px; }
    .topic b { font-size: .95rem; display: block; }
    .topic span { color: var(--muted); font-size: .8rem; }

    /* Practice tab */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 10px; text-align: center; }
    .stat b { display: block; font-size: 1.4rem; letter-spacing: -0.02em; }
    .stat span { color: var(--muted); font-size: .75rem; font-weight: 600; }
    .phrase-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .phrase-item:last-child { border-bottom: 0; }
    .phrase-item .t { flex: 1; min-width: 0; }
    .phrase-item .t b { display: block; font-weight: 600; }
    .phrase-item .t span { color: var(--muted); font-size: .85rem; }
    .score-chip { font-size: .8rem; font-weight: 800; padding: 4px 8px; border-radius: 99px; flex-shrink: 0; }
    .score-chip.g { background: rgba(47,217,139,.15); color: var(--good); }
    .score-chip.o { background: rgba(255,193,69,.15); color: var(--ok); }
    .score-chip.b { background: rgba(255,93,108,.15); color: var(--bad); }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
    .icon-btn svg { width: 20px; height: 20px; }

    /* Profile */
    .profile-top { text-align: center; margin-bottom: 20px; }
    .profile-top .me { width: 84px; height: 84px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-size: 2.2rem; font-weight: 800; margin: 0 auto 10px; }
    .profile-top h2 { font-size: 1.4rem; }
    .profile-top p { color: var(--muted); font-size: .9rem; }
    .week { display: flex; justify-content: space-between; gap: 6px; margin-top: 12px; }
    .week div { flex: 1; text-align: center; font-size: .72rem; color: var(--muted); font-weight: 700; }
    .week i { display: block; height: 34px; border-radius: 10px; background: var(--surface-3); margin-bottom: 5px; position: relative; overflow: hidden; }
    .week i > em { position: absolute; left: 0; right: 0; bottom: 0; background: var(--grad); }
    .week .today { color: var(--text); }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .setting:last-child { border-bottom: 0; }
    .setting label { font-weight: 600; }
    .setting small { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; margin-top: 2px; }
    .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; flex-shrink: 0; }
    .seg button { padding: 6px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; color: var(--muted); }
    .seg button.on { background: var(--surface-3); color: var(--text); }
    .switch { position: relative; width: 50px; height: 30px; border-radius: 99px; background: var(--surface-3); flex-shrink: 0; transition: background .2s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(20px); }
    .text-in { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; color: var(--text); font-size: 1rem; outline: none; }
    .text-in:focus { border-color: var(--accent); }

    /* Onboarding */
    .ob { flex: 1; display: flex; flex-direction: column; max-width: 520px; width: 100%; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
    .ob-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .ob h1 { font-size: 2rem; letter-spacing: -0.03em; line-height: 1.15; margin-bottom: 10px; }
    .ob h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ob p.lead { color: var(--muted); font-size: 1.05rem; line-height: 1.45; margin-bottom: 22px; }
    .ob .welcome-art { display: flex; justify-content: center; margin-bottom: 26px; position: relative; }
    .ob .welcome-art .bub { position: absolute; background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; font-weight: 700; font-size: .95rem; animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 50% { transform: translateY(-6px); } }
    .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 15px 16px; margin-bottom: 10px; transition: border-color .15s, background .15s; }
    .opt .e { font-size: 1.6rem; }
    .opt b { display: block; }
    .opt span { color: var(--muted); font-size: .87rem; }
    .opt.on { border-color: var(--accent); background: rgba(124,92,255,.12); }
    .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
    .dots i.on { background: var(--text); width: 20px; border-radius: 9px; }

    /* Lesson player */
    .lp-top { display: flex; align-items: center; gap: 14px; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; max-width: 640px; width: 100%; margin: 0 auto; }
    .x-btn { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; flex-shrink: 0; }
    .x-btn svg { width: 22px; height: 22px; }
    .pbar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .pbar > i { display: block; height: 100%; background: var(--grad); border-radius: 99px; transition: width .35s; }
    .lp-body { flex: 1; overflow-y: auto; padding: 10px 20px 20px; max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .lp-kicker { color: var(--accent-2); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
    .tutor-line { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 22px; }
    .tutor-line .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 20px 20px 20px; padding: 12px 15px; font-size: 1rem; line-height: 1.45; }
    .phrase-card { background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 26px 20px 20px; text-align: center; margin-bottom: 16px; }
    .phrase-card .es { font-size: 1.85rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 10px; }
    .phrase-card .en { color: var(--muted); font-size: 1.05rem; }
    .phrase-card .en.big { color: var(--text); font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
    .phrase-card .tools { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
    .chip-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: .88rem; }
    .chip-btn svg { width: 18px; height: 18px; }
    .w-good { color: var(--good); } .w-ok { color: var(--ok); } .w-bad { color: var(--bad); }
    .heard { text-align: center; color: var(--muted); font-size: .95rem; min-height: 1.4em; margin-top: 4px; font-style: italic; }
    .hint-box { background: rgba(124,92,255,.12); border: 1px dashed rgba(124,92,255,.5); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; text-align: center; }
    .hint-box b { font-size: 1.2rem; }
    .hint-box span { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }

    .opts { display: flex; flex-direction: column; gap: 10px; }
    .opts button { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 16px; font-size: 1.05rem; font-weight: 600; text-align: left; transition: border-color .15s, background .15s; }
    .opts button.good { border-color: var(--good); background: rgba(47,217,139,.12); }
    .opts button.bad { border-color: var(--bad); background: rgba(255,93,108,.12); animation: shake .3s; }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    /* Roleplay chat */
    .scene { text-align: center; margin-bottom: 18px; }
    .scene .e { font-size: 2.6rem; }
    .scene b { display: block; font-size: 1.15rem; margin-top: 4px; }
    .scene span { color: var(--muted); font-size: .9rem; }
    .chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
    .msg { max-width: 84%; padding: 11px 14px; border-radius: 20px; line-height: 1.4; font-size: 1rem; animation: pop .2s ease-out; }
    .msg.t { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
    .msg.u { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 6px; }
    .msg .tr { display: block; color: var(--muted); font-size: .85rem; margin-top: 4px; }
    .msg .acts { display: flex; gap: 6px; margin-top: 8px; }
    .msg .acts button { font-size: .78rem; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 4px 10px; }
    .fix { align-self: flex-end; max-width: 84%; background: rgba(255,193,69,.1); border: 1px solid rgba(255,193,69,.35); border-radius: 16px; padding: 10px 12px; font-size: .9rem; animation: pop .2s ease-out; }
    .fix b { color: var(--ok); display: block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; }
    .fix span { display: block; color: var(--muted); font-size: .83rem; margin-top: 4px; }
    .task { background: var(--surface-2); border-radius: 18px; padding: 12px 14px; margin-top: 8px; animation: pop .2s ease-out; }
    .task small { color: var(--accent-2); font-weight: 800; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    .task p { font-weight: 600; margin-top: 2px; }
    .typing { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; display: flex; gap: 5px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 50% { opacity: .25; } }
    @keyframes pop { from { transform: translateY(8px); opacity: 0; } }

    /* Mic dock */
    .dock { padding: 10px 20px calc(16px + env(safe-area-inset-bottom)); max-width: 640px; width: 100%; margin: 0 auto; }
    .mic-row { display: flex; align-items: center; justify-content: center; gap: 26px; }
    .side-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
    .side-btn svg { width: 22px; height: 22px; }
    .side-btn:disabled { opacity: .35; }
    .mic { width: 84px; height: 84px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; position: relative; box-shadow: 0 10px 30px rgba(124,92,255,.35); transition: transform .1s; }
    .mic svg { width: 34px; height: 34px; color: #fff; }
    .mic:active { transform: scale(.95); }
    .mic.live { background: var(--bad); box-shadow: 0 10px 30px rgba(255,93,108,.4); }
    .mic.live::before, .mic.live::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--bad); animation: ripple 1.4s ease-out infinite; }
    .mic.live::after { animation-delay: .7s; }
    .mic:disabled { opacity: .4; }
    @keyframes ripple { from { transform: scale(.9); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }
    .mic-cap { text-align: center; color: var(--muted); font-size: .85rem; font-weight: 600; margin-top: 10px; min-height: 1.2em; }
    .type-row { display: flex; gap: 8px; }
    .type-row .text-in { flex: 1; }
    .type-row .send { width: 48px; height: 48px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; flex-shrink: 0; }
    .type-row .send svg { width: 20px; height: 20px; color: #fff; }
    .swap { display: block; margin: 10px auto 0; color: var(--muted); font-weight: 600; font-size: .85rem; }

    /* Feedback sheet */
    .fb { padding: 16px 20px calc(18px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; background: var(--surface); border-top: 1px solid var(--border); animation: up .2s ease-out; }
    .fb-inner { max-width: 600px; margin: 0 auto; }
    .fb .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .fb .score { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; flex-shrink: 0; }
    .fb .score.g { background: rgba(47,217,139,.15); color: var(--good); }
    .fb .score.o { background: rgba(255,193,69,.15); color: var(--ok); }
    .fb .score.b { background: rgba(255,93,108,.15); color: var(--bad); }
    .fb h3 { font-size: 1.2rem; }
    .fb p { color: var(--muted); font-size: .9rem; }
    @keyframes up { from { transform: translateY(30px); opacity: 0; } }

    /* Overlays */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
    .sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 26px 26px 0 0; padding: 24px 20px calc(22px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }

catch { S = Object.assign({}, DEFAULT); }

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
const curStreak = () => (S.lastDay === dayKey() || S.lastDay === yesterday()) ? S.streak : 0;

const allLessons = () => COURSE.flatMap((u, ui) => u.lessons.map((l, li) => ({ u: ui, l: li, lesson: l })));
function nextLesson() { return allLessons().find(x => !S.done[lid(x.u, x.l)]) || null; }
function unlocked(u, l) {

/* ---------- Voice: text to speech ---------- */
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  const es = voices.filter(v => /^es/i.test(v.lang));
  const want = S.accent.toLowerCase();
  const exact = es.filter(v => v.lang.toLowerCase().replace('_','-') === want);
  const pool = exact.length ? exact : (want === 'es-mx' ? es.filter(v => /us|419|mx/i.test(v.lang)) : []).concat(es);
  // Prefer the nicer voices most platforms ship
  return pool.find(v => /premium|enhanced|natural|google|paulina|monica|mónica|lucia|lucía/i.test(v.name)) || pool[0] || null;
}
function say(text, slow = false) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v) u.voice = v;
    u.lang = v ? v.lang : S.accent;
    u.rate = (slow ? 0.6 : 0.95) * S.rate;
    let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1500 + text.length * 140 / u.rate);
    speechSynthesis.speak(u);
  });
}

/* ---------- Voice: speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBlocked = false;
let rec = null;
const canSpeak = () => !!SR && !micBlocked;

function listen(onInterim) {
  return new Promise((resolve, reject) => {
    if (window.speechSynthesis) speechSynthesis.cancel();
    rec = new SR();
    rec.lang = S.accent; rec.interimResults = true; rec.maxAlternatives = 4; rec.continuous = false;
    let finals = [], interim = '', settled = false;
    const finish = () => {
      if (settled) return; settled = true; rec = null;
      const alts = finals.length ? finals : (interim ? [interim] : []);
      resolve(alts);
    };
    rec.onresult = e => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { finals = Array.from(r).map(a => a.transcript); }
        else interim += r[0].transcript;
      }
      onInterim && onInterim(finals[0] || interim);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { micBlocked = true; settled = true; rec = null; reject(e.error); }
      else if (e.error === 'no-speech' || e.error === 'aborted') finish();
      else { settled = true; rec = null; reject(e.error); }
    };
    rec.onend = finish;
    try { rec.start(); } catch (err) { settled = true; rec = null; reject(err); }
  });
}
function stopListening() { if (rec) try { rec.stop(); } catch {} }

/* ---------- Pronunciation scoring ---------- */
const NUMS = { 0:'cero',1:'uno',2:'dos',3:'tres',4:'cuatro',5:'cinco',6:'seis',7:'siete',8:'ocho',9:'nueve',10:'diez',11:'once',12:'doce',15:'quince',20:'veinte',30:'treinta' };
function norm(s) {
  return String(s).toLowerCase()
    .replace(/\b(\d{1,2}):(\d{2})\b/g, (m, h, mm) => `${h} ${mm === '30' ? 'y media' : mm === '15' ? 'y cuarto' : mm === '00' ? '' : mm}`)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[¿?¡!.,;:"“”«»()…\-]/g, ' ')
    .split(/\s+/).filter(Boolean)
    .map(w => /^\d+$/.test(w) && NUMS[+w] ? NUMS[+w] : w)
    .join(' ');
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const sim = (a, b) => a === b ? 1 : 1 - lev(a, b) / Math.max(a.length, b.length);

// Aligns the spoken words against the target and returns a 0-1 score plus a per-word grade
function grade(target, spoken) {
  const disp = target.split(/\s+/);
  const T = [], map = [];
  disp.forEach((d, i) => { if (d === '*') return; norm(d).split(' ').filter(Boolean).forEach(w => { T.push(w); map.push(i); }); });
  const Sp = norm(spoken).split(' ').filter(Boolean);
  const m = T.length, n = Sp.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const s = sim(T[i-1], Sp[j-1]);
    dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1], s >= 0.5 ? dp[i-1][j-1] + s : -1);
  }
  const ws = new Array(m).fill(0);
  let i = m, j = n;
  while (i > 0 && j > 0) {
    const s = sim(T[i-1], Sp[j-1]);
    if (s >= 0.5 && dp[i][j] === dp[i-1][j-1] + s) { ws[i-1] = s; i--; j--; }
    else if (dp[i][j] === dp[i-1][j]) i--;
    else j--;
  }
  const score = m ? ws.reduce((a, b) => a + b, 0) / m : (n ? 1 : 0);
  // Grade each display word by its weakest part
  const words = disp.map((d, k) => {
    if (d === '*') return { d: '___', c: 'good' };
    const parts = ws.filter((_, x) => map[x] === k);
    const v = parts.length ? Math.min(...parts) : 1;
    return { d, c: v >= 0.85 ? 'good' : v >= 0.5 ? 'ok' : 'bad' };
  });
  return { score, words };
}
function bestGrade(targets, alts) {
  let best = { score: -1 };
  for (const t of targets) for (const a of alts) {
    const g = grade(t, a); if (g.score > best.score) best = { ...g, target: t, heard: a };
  }
  return best;
}
const pct = s => Math.round(Math.max(0, s) * 100);
const cls = s => s >= 0.85 ? 'g' : s >= 0.6 ? 'o' : 'b';
function verdict(s) {
  if (s >= 0.95) return ['¡Perfecto!', 'Native-level pronunciation.'];
  if (s >= 0.85) return ['¡Excelente!', 'Really clear — nice work.'];
  if (s >= 0.7) return ['¡Muy bien!', 'Good! Tap the words in orange to hear them again.'];
  if (s >= 0.5) return ['¡Casi!', 'Almost there. Listen once more and try again.'];
  return ['Try again', 'I didn\'t quite catch that. Listen, then say it again.'];
}
const coloredWords = g => g.words.map(w => `<span class="w-${w.c}">${esc(w.d)}</span>`).join(' ');

function recordPhrase(es, en, score) {
  const p = S.phrases[es] || { en, score: 0, tries: 0 };
  p.en = en; p.tries++; p.last = Date.now();
  p.score = p.tries === 1 ? score : Math.round(p.score * 0.4 + score * 0.6);
  S.phrases[es] = p; S.spoken++;
}

const body = () => $('#lpBody');

/* Mic dock: big mic button with replay/slow side buttons, or a text box when typing.
   opts: { onResult(alts), replay?, slow?, hint?, caption? } */
function micDock(opts) {
  const typing = !canSpeak() || P.typing;
  const d = dock();
  if (typing) {
    d.innerHTML = `<div class="dock"><div class="type-row"><input class="text-in" id="typeIn" placeholder="Type in Spanish…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="send" id="typeGo" aria-label="Send">${IC.send}</button></div>
      <div class="mic-row" style="margin-top:12px;gap:12px">${opts.replay ? `<button class="chip-btn" id="dkReplay">${IC.play} Listen</button>` : ''}${opts.hint ? `<button class="chip-btn" id="dkHint">${IC.bulb} Hint</button>` : ''}</div>
      ${canSpeak() ? `<button class="swap" id="dkSwap">🎙️ Speak instead</button>` : ''}</div>`;
    const go = () => { const v = $('#typeIn').value.trim(); if (v) opts.onResult([v], true); };
    $('#typeGo').onclick = go;
    $('#typeIn').onkeydown = e => { if (e.key === 'Enter') go(); };
    if (!('ontouchstart' in window)) setTimeout(() => $('#typeIn') && $('#typeIn').focus(), 50);
  } else {
    d.innerHTML = `<div class="dock"><div class="mic-row">
        <button class="side-btn" id="dkReplay" ${opts.replay ? '' : 'disabled'} aria-label="Listen">${IC.play}</button>
        <button class="mic" id="dkMic" aria-label="Speak">${IC.mic}</button>
        <button class="side-btn" id="${opts.hint ? 'dkHint' : 'dkSlow'}" ${opts.slow || opts.hint ? '' : 'disabled'} aria-label="${opts.hint ? 'Hint' : 'Slow'}">${opts.hint ? IC.bulb : IC.slow}</button>
      </div><div class="mic-cap" id="dkCap">${opts.caption || 'Tap to speak'}</div>
      <button class="swap" id="dkSwap">⌨️ Can't speak now? Type instead</button></div>`;
    const mic = $('#dkMic');
    mic.onclick = async () => {
      if (mic.classList.contains('live')) { stopListening(); return; }
      mic.classList.add('live'); mic.innerHTML = IC.stop; $('#dkCap').textContent = 'Listening…';
      if (opts.onStart) opts.onStart();
      try {
        const alts = await listen(t => { const h = $('#heard'); if (h) h.textContent = t; });
        mic.classList.remove('live'); mic.innerHTML = IC.mic;
        if (!alts.length || !alts[0].trim()) { $('#dkCap').textContent = 'Didn\'t hear anything — tap and try again'; return; }
        opts.onResult(alts, false);
      } catch (err) {
        mic.classList.remove('live'); mic.innerHTML = IC.mic;
        if (micBlocked) { toast('Microphone blocked — switching to typing'); micDock(opts); }
        else $('#dkCap').textContent = 'Something went wrong — tap to try again';
      }
    };
  }
  const r = $('#dkReplay'); if (r && opts.replay) r.onclick = () => opts.replay(false);
  const s = $('#dkSlow'); if (s && opts.slow) s.onclick = () => opts.slow();
  const h = $('#dkHint'); if (h && opts.hint) h.onclick = () => opts.hint();
  const sw = $('#dkSwap'); if (sw) sw.onclick = () => { stopListening(); P.typing = !P.typing; micDock(opts); };
}

function feedbackSheet({ score, title, text, onContinue, onRetry, continueLabel = 'Continue' }) {
  const [vt, vx] = verdict(score);
  dock().innerHTML = `<div class="fb"><div class="fb-inner"><div class="head"><div class="score ${cls(score)}">${pct(score)}%</div><div><h3>${esc(title || vt)}</h3><p>${esc(text || vx)}</p></div></div>
    ${onRetry ? '<button class="btn quiet" id="fbRetry">Try again</button>' : ''}<button class="btn" id="fbGo">${continueLabel}</button></div></div>`;
  $('#fbGo').onclick = onContinue;
  if (onRetry) $('#fbRetry').onclick = onRetry;
}

/* ---------- Lessons ---------- */
function buildSteps(lesson) {
  const steps = [{ type: 'intro' }];
  lesson.phrases.forEach(p => steps.push({ type: 'learn', p }));
  shuffle(lesson.phrases.slice()).forEach((p, i) => steps.push({ type: i % 2 ? 'listen' : 'say', p }));
  steps.push({ type: 'chat' });
  return steps;
}
function startLesson(u, l) {
  const lesson = COURSE[u].lessons[l];
  P = { kind: 'lesson', u, l, lesson, steps: buildSteps(lesson), i: 0, scores: [], typing: false, start: Date.now() };
  openPlayer(); runStep();
}
function nextStep() { P.i++; if (P.kind === 'drill') runDrill(); else runStep(); }
function runStep() {
  setProgress();
  const step = P.steps[P.i];
  if (!step) return finishLesson();
  body().scrollTop = 0;
  ({ intro: stepIntro, learn: stepLearn, say: stepSay, listen: stepListen, chat: stepChat })[step.type](step);
}

function stepIntro() {
  const L = P.lesson;
  body().innerHTML = `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center">
    ${avatar('xl')}<div class="lp-kicker" style="margin-top:20px">Unit ${P.u + 1} · ${esc(COURSE[P.u].title)}</div>
    <h1 style="font-size:1.9rem;letter-spacing:-0.02em;margin-bottom:10px">${L.icon} ${esc(L.title)}</h1>
    <p style="color:var(--muted);font-size:1.05rem;line-height:1.45;max-width:360px">In this lesson you'll learn to <b style="color:var(--text)">${esc(L.goal.charAt(0).toLowerCase() + L.goal.slice(1))}</b>. You'll learn ${L.phrases.length} phrases, then use them in a conversation with me.</p></div>`;
  dock().innerHTML = `<div class="dock"><button class="btn" id="goBtn">Let's go</button></div>`;
  $('#goBtn').onclick = () => { say('¡Vamos!'); nextStep(); };
}

function phraseTools() {
  return `<div class="tools"><button class="chip-btn" data-p="n">${IC.play} Listen</button><button class="chip-btn" data-p="s">${IC.slow} Slow</button></div>`;
}
function bindPhraseTools(es) {
  body().querySelectorAll('[data-p]').forEach(b => b.onclick = () => say(es, b.dataset.p === 's'));
}

// Speak-a-phrase step shared by "learn" (Spanish shown) and "say" (English shown)
function speakStep(p, mode) {
  const [es, en] = p; let tries = 0;
  const top = mode === 'learn'
    ? `<div class="lp-kicker">New phrase</div><div class="tutor-line">${avatar()}<div class="bubble">Listen, then say it out loud.</div></div>`
    : `<div class="lp-kicker">Say it in Spanish</div><div class="tutor-line">${avatar()}<div class="bubble">How would you say this?</div></div>`;
  const card = (g) => mode === 'learn' || g
    ? `<div class="phrase-card"><div class="es" id="esLine">${g ? coloredWords(g) : esc(es)}</div><div class="en">${esc(en)}</div>${phraseTools()}</div>`
    : `<div class="phrase-card"><div class="en big">${esc(en)}</div><div class="tools"><button class="chip-btn" id="peek">${IC.bulb} Show answer</button></div></div><div id="peekBox"></div>`;
  const draw = g => {
    body().innerHTML = `${top}${card(g)}<div class="heard" id="heard"></div>`;
    if (mode === 'learn' || g) bindPhraseTools(es);
    const pk = $('#peek'); if (pk) pk.onclick = () => { $('#peekBox').innerHTML = `<div class="hint-box"><b>${esc(es)}</b></div>`; say(es); pk.remove(); };
  };
  const ask = () => {
    draw(null);
    micDock({
      replay: mode === 'learn' ? () => say(es) : null,
      slow: mode === 'learn' ? () => say(es, true) : null,
      caption: mode === 'learn' ? 'Tap and repeat the phrase' : 'Tap and say it in Spanish',
      onResult: (alts, typed) => {
        tries++;
        const g = bestGrade([es], alts);
        draw(g); $('#heard').textContent = `“${g.heard}”`;
        P.scores.push(g.score);
        const pass = g.score >= 0.7;
        if (pass || tries >= 2) recordPhrase(es, en, pct(g.score));
        if (pass) say(g.score >= 0.95 ? '¡Perfecto!' : '¡Muy bien!');
        feedbackSheet({
          score: g.score,
          text: !pass && tries >= 2 ? 'Keep practicing — this one will come up again in Practice.' : null,
          onRetry: pass ? null : () => { P.scores.pop(); ask(); },
          onContinue: nextStep,
          continueLabel: pass ? 'Continue' : 'Skip for now',
        });
      },
    });
  };
  ask();
  if (mode === 'learn') say(es);
}
const stepLearn = s => speakStep(s.p, 'learn');
const stepSay = s => speakStep(s.p, 'say');

function stepListen(s) {
  const [es, en] = s.p;
  const pool = shuffle(allLessons().flatMap(x => x.lesson.phrases).filter(q => q[1] !== en)).slice(0, 3).map(q => q[1]);
  const opts = shuffle([en, ...pool]);
  body().innerHTML = `<div class="lp-kicker">Listen</div><div class="tutor-line">${avatar()}<div class="bubble">What did I just say?</div></div>
    <div class="phrase-card" style="padding:22px"><div class="tools" style="margin-top:0"><button class="chip-btn" data-p="n" style="padding:14px 20px;font-size:1rem">${IC.play} Play again</button><button class="chip-btn" data-p="s">${IC.slow} Slow</button></div></div>
    <div class="opts">${opts.map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  bindPhraseTools(es);
  dock().innerHTML = '';
  let first = true;
  body().querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    if (b.dataset.o === en) {
      b.classList.add('good');
      body().querySelectorAll('[data-o]').forEach(x => x.disabled = true);
      P.scores.push(first ? 1 : 0.6);
      const sc = first ? 1 : 0.6;
      dock().innerHTML = `<div class="fb"><div class="fb-inner"><div class="head"><div class="score ${cls(sc)}">${first ? '✓' : '~'}</div><div><h3>${first ? '¡Correcto!' : 'Got it'}</h3><p>“${esc(es)}”</p></div></div><button class="btn" id="fbGo">Continue</button></div></div>`;
      $('#fbGo').onclick = nextStep;
    } else { b.classList.add('bad'); b.disabled = true; first = false; }

}

/* ---------- Roleplay ---------- */
function stepChat() { runRoleplay(P.lesson.rp, nextStep); }
function startRoleplayOnly(u, l) {

function fillName(s) { return s.replace('*', S.name || '___'); }

function runRoleplay(rp, onDone) {
  body().innerHTML = `<div class="scene"><div class="e">${rp.icon}</div><b>${esc(rp.scene)}</b><span>Roleplay with Lucía</span></div><div class="chat" id="chat"></div>`;
  dock().innerHTML = '';
  const chat = $('#chat');
  const lines = rp.lines; let k = 0;
  const scrollDown = () => { body().scrollTop = body().scrollHeight; };
  const tutorMsg = (es, en) => {
    const m = document.createElement('div'); m.className = 'msg t';
    m.innerHTML = `${esc(es)}${S.showEn ? `<span class="tr">${esc(en)}</span>` : ''}<div class="acts"><button data-a="play">🔊 Replay</button>${S.showEn ? '' : '<button data-a="tr">Translate</button>'}</div>`;
    m.querySelector('[data-a="play"]').onclick = () => say(es);
    const tr = m.querySelector('[data-a="tr"]'); if (tr) tr.onclick = () => { tr.remove(); m.insertAdjacentHTML('beforeend', `<span class="tr">${esc(en)}</span>`); };
    chat.appendChild(m); scrollDown();
  };
  const step = async () => {
    const line = lines[k];
    if (!line) { dock().innerHTML = ''; setTimeout(onDone, 700); return; }
    if (line[0] === 't') {
      const typing = document.createElement('div'); typing.className = 'typing'; typing.innerHTML = '<i></i><i></i><i></i>';
      chat.appendChild(typing); scrollDown();
      await new Promise(r => setTimeout(r, 600));
      typing.remove(); tutorMsg(line[1], line[2]);
      k++;
      const next = lines[k];
      if (next && next[0] === 'u') { say(line[1]); step(); } else { await say(line[1]); step(); }
      return;
    }
    // learner turn
    const [, task, answers] = line; let tries = 0;
    const taskEl = document.createElement('div'); taskEl.className = 'task';
    taskEl.innerHTML = `<small>Your turn</small><p>${esc(task)}</p><div id="hintSlot"></div>`;
    chat.appendChild(taskEl); scrollDown();
    const showHint = () => {
      const slot = taskEl.querySelector('#hintSlot'); if (!slot || slot.innerHTML) return;
      const h = fillName(answers[0]);
      slot.innerHTML = `<div class="hint-box" style="margin:10px 0 0"><b>${esc(h)}</b><span>Try saying this</span></div>`;
      if (!h.includes('___')) say(h);
      scrollDown();
    };
    const tutorLine = lines[k-1] && lines[k-1][0] === 't' ? lines[k-1][1] : '';
    const onResult = alts => {
      tries++;
      const g = bestGrade(answers, alts);
      const pass = g.score >= 0.6;
      if (pass || tries >= 3) {
        taskEl.remove();
        const m = document.createElement('div'); m.className = 'msg u'; m.textContent = g.heard || alts[0];
        chat.appendChild(m);
        if (!pass) { const f = document.createElement('div'); f.className = 'fix'; f.innerHTML = `<b>You could say</b>${esc(fillName(answers[0]))}`; chat.appendChild(f); }
        P.scores.push(pass ? g.score : 0.4);
        S.spoken++;
        if (pass) say(['¡Muy bien!', '¡Eso es!', '¡Perfecto!'][tries - 1] || '¡Bien!');
        scrollDown(); dock().innerHTML = '';
        k++; setTimeout(step, pass ? 900 : 400);
      } else {
        const cap = $('#dkCap'), msg = tries >= 2 ? 'Try the hint above' : 'Hmm, not quite — try again';
        if (cap) cap.textContent = msg; else toast(msg);
        const h = $('#heard'); if (h) h.textContent = '';
        if (tries >= 2) showHint();
      }
    };
    micDock({ replay: () => say(tutorLine), hint: showHint, caption: 'Tap to answer', onResult });
  };
  step();
}

/* ---------- Lesson complete ---------- */
function finishLesson() {

function confetti() {

/* ---------- Speaking drill (Practice tab) ---------- */
function startDrill() {

/* ---------- Free talk with Lucía ----------
   Runs entirely on the device: Lucía asks questions on a topic, reacts to what
   you say, answers when you ask her back, and corrects common learner mistakes.
   q: [spanish question, english, example answer, Lucía's own answer?] */
function talkReply(text) {
  const P0 = P, topic = P0.topic, qs = topic.q;
  const n = norm(text), words = n.split(' ').filter(Boolean);
  const parts = [];
  const cur = qs[P0.qi];

  // Mostly English? Ask again in Spanish with an example
  const eng = words.filter(w => ENGLISH.has(w)).length;
  if (words.length && eng >= 2 && eng / words.length >= 0.4) {
    return { retry: true, fix: { text: fillName(cur[2]), label: 'Try saying' }, parts: [['¡En español, por favor! 😊', 'In Spanish, please! 😊'], [cur[0], cur[1]]] };
  }

  const fix = checkGrammar(text);
  const asked = /[¿?]/.test(text) || /(^| )y (tu|usted)$/.test(n) || /^(que|como|donde|cual|cuando|por que|quien|cuanto)( |$)/.test(n);
  if (asked) {
    parts.push(cur[3] ? [cur[3][0], cur[3][1]] : ['¡Buena pregunta!', 'Good question!']);
  } else if (/(^| )no me (gusta|gustan|encanta)/.test(n)) {
    parts.push(pick([['¿De verdad? ¡Qué interesante!', 'Really? Interesting!'], ['Ah, ¿no? Entiendo.', 'Oh, no? I understand.']]));
  } else if (/(^| )me (gusta|gustan|encanta|encantan)( |$)/.test(n)) {
    parts.push(pick([['¡A mí también!', 'Me too!'], ['¡Qué bien! A mí también me gusta.', 'Nice! I like it too.'], ['¡Excelente gusto!', 'Great taste!']]));
  } else if (/^no( |$)/.test(n) && !topic.formal) {
    parts.push(pick([['Ah, entiendo.', 'Ah, I see.'], ['¿No? Bueno, ¡no pasa nada!', 'No? Well, no problem!']]));
  } else if (/^si( |$)/.test(n) && !topic.formal) {
    parts.push(pick([['¡Qué bien!', 'How nice!'], ['¡Genial!', 'Great!']]));
  } else {
    parts.push(pick(topic.formal ? ACK_FORMAL : ACK.concat([[S.accent === 'es-ES' ? '¡Qué guay!' : '¡Qué padre!', 'How cool!']])));
  }
  if (!asked && cur[3] && Math.random() < 0.5) parts.push(cur[3]);

  P0.qi++;
  const next = qs[P0.qi];
  if (next) parts.push([next[0], next[1]]);
  else parts.push(['¡Me encantó hablar contigo! Tu español está mejorando mucho.', 'I loved talking with you! Your Spanish is really improving.']);
  return { fix, parts, end: !next };
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const ACK = [['¡Qué interesante!', 'How interesting!'], ['¡Genial!', 'Great!'], ['Ah, ¡qué bueno!', 'Oh, that\'s good!'], ['¡Me encanta!', 'I love it!'], ['Ya veo.', 'I see.']];
const ACK_FORMAL = [['¡Perfecto!', 'Perfect!'], ['Muy bien.', 'Very good.'], ['Claro.', 'Of course.'], ['De acuerdo.', 'Okay.']];
const ENGLISH = new Set('the i my is and you to it like yes what how dont want have am are from live name with this that of in we they he she was be do go my your please thanks thank hello hi okay'.split(' '));

/* Common learner mistakes: [pattern, replacement, tip]. Matches whole words, accents optional */
const GRAMMAR = [
  ['yo fue', 'yo fui', '"Fui" means "I went / I was" — "fue" is for he or she.'],
  ['yo (?:es|eres)', 'yo soy', 'With "yo", use "soy" (I am).'],
  ['yo est[aá]', 'yo estoy', 'With "yo", use "estoy" (I am).'],
  ['yo tiene', 'yo tengo', '"Tengo" means "I have".'],
  ['yo va', 'yo voy', '"Voy" means "I go".'],
  ['yo hace', 'yo hago', '"Hago" means "I do / I make".'],
  ['yo sabe', 'yo sé', '"Sé" means "I know".'],
  ['yo (quier|pued|prefier|com|viv|trabaj|habl|toc|cocin|escuch|necesit|estudi|viaj)e', 'yo $1o', 'With "yo", present-tense verbs end in -o.'],
  ['yo trabaja', 'yo trabajo', 'With "yo", present-tense verbs end in -o.'],
  ['yo (?:me )?gust[ao]', 'me gusta', 'Say "me gusta" (it pleases me) — no "yo" needed.'],
  ['me gusta (los|las)', 'me gustan $1', 'Use "gustan" when what you like is plural.'],
  ['me encanta (los|las)', 'me encantan $1', 'Use "encantan" when what you love is plural.'],
  ['(?:soy|estoy) (\\p{L}+|\\d+) años', 'tengo $1 años', 'Age uses "tener": "tengo 25 años".'],
  ['estoy de', 'soy de', 'Where you\'re from uses "ser": "soy de…".'],
  ['(?:soy|estoy) (hambre|sed|sueño|frío|frio|calor|miedo)', 'tengo $1', 'Spanish says "tengo hambre" — literally "I have hunger".'],
  ['(?:es|est[aá]) (muy |mucho )?(calor|fr[ií]o)', 'hace $1$2', 'Weather uses "hacer": "hace calor".'],
  ['soy (cansad[oa]|enferm[oa]|aburrid[oa]|estresad[oa]|ocupad[oa]|nervios[oa]|content[oa])', 'estoy $1', 'Feelings and states use "estar": "estoy cansado".'],
  ['es bien', 'está bien', '"Está bien" means "it\'s fine".'],
  ['a el', 'al', '"a + el" always becomes "al".'],
  ['de el', 'del', '"de + el" always becomes "del".'],
  ['mucho gracias', 'muchas gracias', '"Gracias" is feminine plural: "muchas gracias".'],
  ['muy mucho', 'muchísimo', 'Say "muchísimo" for "very much".'],
  ['la problema', 'el problema', '"Problema" is masculine: "el problema".'],
].map(([p, r, tip]) => [new RegExp(`(?<!\\p{L})${p}(?!\\p{L})`, 'giu'), r, tip]);

function checkGrammar(text) {
  let out = text, tip = null;
  for (const [re, rep, t] of GRAMMAR) {
    const next = out.replace(re, (...m) => {
      const groups = m.slice(1, -2);
      let r = rep.replace(/\$(\d)/g, (_, i) => groups[i - 1] || '');
      if (/^\p{Lu}/u.test(m[0])) r = r.charAt(0).toUpperCase() + r.slice(1);
      return r;
    });
    if (next !== out) { out = next; tip = tip || t; }
  }
  return out !== text ? { text: out, tip, label: 'Better' } : null;
}

function startFreeTalk(topic) {
  if (topic.random) topic = pick(TOPICS.filter(t => !t.random));
  P = { kind: 'talk', topic, qi: 0, typing: false, busy: false, turns: 0, last: '' };
  openPlayer(); $('#pbarWrap').classList.remove('hidden');
  body().innerHTML = `<div class="scene"><div class="e">${topic.e}</div><b>${esc(topic.t)}</b><span>Free talk with Lucía</span></div><div class="chat" id="chat"></div>`;
  const first = topic.q[0];
  const parts = topic.formal ? [[first[0], first[1]]] : [[`¡Hola${S.name ? ', ' + S.name : ''}!`, `Hi${S.name ? ', ' + S.name : ''}!`], [first[0], first[1]]];
  lucia(parts);
}

function lucia(parts, delay = 0) {
  const session = P, chat = $('#chat');
  const es = parts.map(p => p[0]).join(' '), en = parts.map(p => p[1]).join(' ');
  session.busy = true; talkDock();
  const typing = document.createElement('div'); typing.className = 'typing'; typing.innerHTML = '<i></i><i></i><i></i>';
  setTimeout(() => {
    if (P !== session) return;
    chat.appendChild(typing); body().scrollTop = body().scrollHeight;
    setTimeout(() => {
      if (P !== session) return;
      typing.remove();
      const m = document.createElement('div'); m.className = 'msg t';
      m.innerHTML = `${esc(es)}${S.showEn ? `<span class="tr">${esc(en)}</span>` : ''}<div class="acts"><button data-a="play">🔊 Replay</button>${S.showEn ? '' : '<button data-a="tr">Translate</button>'}</div>`;
      m.querySelector('[data-a="play"]').onclick = () => say(es);
      const tr = m.querySelector('[data-a="tr"]'); if (tr) tr.onclick = () => { tr.remove(); m.insertAdjacentHTML('beforeend', `<span class="tr">${esc(en)}</span>`); };
      chat.appendChild(m); body().scrollTop = body().scrollHeight;
      session.last = es; session.busy = false;
      $('#pbar').style.width = `${(session.qi / session.topic.q.length) * 100}%`;
      say(es);
      if (session.qi >= session.topic.q.length) talkEnd(); else talkDock();
    }, 700);
  }, delay);
}

function userSays(text) {
  const chat = $('#chat');
  chat.querySelectorAll('.task').forEach(t => t.remove());
  const m = document.createElement('div'); m.className = 'msg u'; m.textContent = text; chat.appendChild(m);
  const r = talkReply(text);
  if (r.fix) {
    const f = document.createElement('div'); f.className = 'fix';
    f.innerHTML = `<b>${r.fix.label}</b>${esc(r.fix.text)}${r.fix.tip ? `<span>${esc(r.fix.tip)}</span>` : ''}`;
    chat.appendChild(f);
  }
  body().scrollTop = body().scrollHeight;
  S.spoken++; if (!r.retry) P.turns++;
  if (P.turns === 3) markStreakOnce();
  lucia(r.parts, 300);
}
function markStreakOnce() { if (markStreak()) { save(); toast(`🔥 ${S.streak} day streak!`); } }

function talkHint() {
  const chat = $('#chat'); if (chat.querySelector('.task')) return;
  const ex = fillName(P.topic.q[P.qi][2]);
  const t = document.createElement('div'); t.className = 'task';
  t.innerHTML = `<small>Idea</small><div class="hint-box" style="margin:6px 0 0"><b>${esc(ex)}</b><span>Say this, or answer in your own words</span></div>`;
  chat.appendChild(t); body().scrollTop = body().scrollHeight;
  if (!ex.includes('___')) say(ex);
}

function talkDock() {
  if (P.busy) { dock().innerHTML = `<div class="dock"><div class="mic-cap">Lucía is talking…</div></div>`; return; }
  micDock({ replay: () => say(P.last), hint: talkHint, caption: 'Tap to answer in Spanish', onResult: alts => userSays(alts[0]) });
}

function talkEnd() {
  markStreakOnce(); save();
  dock().innerHTML = `<div class="fb"><div class="fb-inner"><div class="head"><div class="score g">✓</div><div><h3>¡Conversación completa!</h3><p>You answered ${P.turns} times in Spanish.</p></div></div>
    <button class="btn quiet" id="talkAgain">New topic</button><button class="btn" id="fbGo">Done</button></div></div>`;
  $('#fbGo').onclick = closePlayer;
  $('#talkAgain').onclick = () => { const cur = P.topic; startFreeTalk(pick(TOPICS.filter(t => !t.random && t !== cur))); };
}

/* ---------- Boot ---------- */
if (S.onboarded) show('learn'); else renderOnboard();
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
